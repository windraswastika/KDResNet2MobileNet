    "torchvision>=0.20",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-image>=0.24",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pillow>=10.0",
]

[tool.uv]
package = false
